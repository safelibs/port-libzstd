schema_version = 1

[phase4_release_gate]
install_root = "../../../out/install/release-default"
helper_root = "../../../out/original-cli/lib"
metadata = "../../../out/deb/default/metadata.env"
policy = "The Phase 5 fuzz wrapper reuses these checked-in corpora offline and only overlays small upstream golden samples that are already in-tree."

[fallback_sets.raw]
path = "raw"
seed_source = "../../../../original/libzstd-1.5.5+dfsg2/tests/golden-compression/http"
usage = "raw-data fuzz targets and seekable roundtrip coverage"

[fallback_sets.compressed]
path = "compressed"
seed_source = "../../../../original/libzstd-1.5.5+dfsg2/tests/golden-decompression"
usage = "compressed-input fuzz targets"

[fallback_sets.dictionary]
seed_source = "../../../../original/libzstd-1.5.5+dfsg2/tests/golden-dictionaries/http-dict-missing-symbols"
usage = "dictionary-aware fuzz targets use the in-tree upstream golden dictionary directly"

[[expected_failure]]
target = "raw_dictionary_round_trip"
status = 134
reason = "offline fallback corpus can drive the public prefix-dictionary target into a dictionary-corruption assertion"

[[expected_failure]]
target = "seekable_roundtrip"
status = 134
reason = "offline fallback corpus can drive the seekable target into an unknown-frame-descriptor assertion"
